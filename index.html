<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dhiteta AI Office</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Press+Start+2P&family=Pixelify+Sans&display=swap" rel="stylesheet">
<style>
  :root { --blue: #1f5fbf; --navy: #0f2a52; --bg: #eef3fa; --panel: #ffffff; --line: #c9d7ec; }
  body { margin: 0; background: var(--bg); color: var(--navy); font-family: 'Pixelify Sans', 'Noto Sans Thai', sans-serif; line-height: 1.6; }
  main { max-width: 1280px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .logo { width: 28px; height: 28px; background: var(--blue); color: #fff; font-family: 'Press Start 2P', 'Noto Sans Thai', sans-serif; font-size: 14px;
          display: grid; place-items: center; box-shadow: 4px 4px 0 var(--navy); }
  h1 { font-family: 'Press Start 2P', 'Noto Sans Thai', sans-serif; font-size: 16px; margin: 0; }
  h1 span { color: var(--blue); }
  canvas { width: 100%; box-sizing: border-box; image-rendering: pixelated; border: 4px solid var(--blue); display: block; background: #dce8f7; box-shadow: 6px 6px 0 var(--navy); }
  .bar { display: flex; gap: 12px; align-items: center; margin: 16px 0 10px; flex-wrap: wrap; }
  button { font-family: 'Press Start 2P', 'Noto Sans Thai', sans-serif; font-size: 10px; background: var(--blue); color: #fff; border: 3px solid var(--navy); padding: 8px 12px; cursor: pointer; }
  button:hover { background: #2f7be0; }
  #status { font-size: 15px; }
  .legend { font-size: 15px; opacity: .85; }
  ul { list-style: none; padding: 0; margin: 0; max-height: 240px; overflow: auto; background: var(--panel); border: 4px solid var(--line); }
  li { padding: 4px 10px; border-bottom: 1px solid #e6edf7; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li b { color: var(--blue); }
</style>
</head>
<body>
<main>
  <header><div class="logo">D</div><h1>DHITETA <span>AI</span> · AGENT OFFICE</h1></header>
  <canvas id="c"></canvas>
  <div class="bar">
    <button id="demo">▶ DEMO</button>
    <span id="status">กำลังเชื่อมต่อ…</span>
  </div>
  <div class="legend"><b style="color:#d97757">✳ Claude</b> = เสื้อสูทส้ม · <b>&gt;_ Codex</b> = ฮู้ดดำ<br>☕ Lounge = ว่าง · 📖 แถวโต๊ะหน้า = อ่าน/ค้นหา · 💻 แถวโต๊ะหลัง = แก้ไฟล์ · 🌐 จอใหญ่ = ค้นเว็บ · 💭 Meeting = คิด/ตอบ · ⚙️ Server = รันคำสั่ง</div>
  <br>
  <ul id="log"></ul>
</main>
<script src="/office.js"></script>
</body>
</html>
